name: how to access output
on:
    push:
        branches:
            - main 
jobs: 
    env1:
         runs-on: ubuntu-latest   
         outputs:
             status: ${{ steps.show-version.outputs.status }}
         steps: 
            - name: our version
              id: show-version    
              run: | 
                echo "version=1.0.0"   >>"$GITHUB_OUTPUT"
                echo "status=success"  >>"$GITHUB_OUTPUT"
              
            - name:  show version from brevious step
              run: echo "version = ${{ steps.show-version.outputs.version}}"  

            - name: dddd
              if : "${{ steps.show-version.outputs.status == 'success' }}"
              run: echo "welcome"
              

            - name: dddd
              if : "${{ steps.show-version.outputs.status == 'fail' }}"
              run: echo "fail"



